groups:
  - name: cryptotrading-runtime
    rules:
      - alert: CryptoTradingApiErrors
        expr: sum(rate(cryptotrading_api_errors_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CryptoTrading API is returning errors.
      - alert: CryptoTradingReconciliationMismatch
        expr: sum(increase(cryptotrading_reconciliation_mismatches_total[15m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Reconciliation mismatch observed.
      - alert: CryptoTradingWorkerHeartbeatMissing
        expr: sum(rate(cryptotrading_worker_heartbeats_total[10m])) == 0 or absent(cryptotrading_worker_heartbeats_total)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: No worker heartbeat was observed.
      - alert: CryptoTradingBackupStaleOrFailed
        expr: (time() - cryptotrading_backup_last_success_timestamp_seconds) > 900 or cryptotrading_backup_last_run_failed > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: PostgreSQL scheduled backup exceeded 15-minute RPO window or failed.
      - alert: CryptoTradingLowDiskSpace
        expr: cryptotrading_disk_free_bytes < 2147483648 or cryptotrading_disk_free_ratio < 0.10
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: Host disk free space fell below 2 GB or 10% fail-closed threshold.
      - alert: CryptoTradingSafeModeActivated
        expr: sum(cryptotrading_safemode_active) > 0 or sum(increase(cryptotrading_safemode_transitions_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: SafeMode activation observed.
