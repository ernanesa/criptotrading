global:
  resolve_timeout: 5m

route:
  receiver: local-only
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# This local profile intentionally has no email, webhook, pager, or cloud
# receiver. Alerts are grouped and visible in the loopback-only Alertmanager UI.
receivers:
  - name: local-only
