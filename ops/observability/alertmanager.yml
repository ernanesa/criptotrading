global:
  resolve_timeout: 5m

route:
  receiver: local-only
  group_by: [alertname, service, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

# Local profile delivers alerts to the loopback-only auditable webhook sink
# (/operational/alerts/webhook) and keeps them visible in the Alertmanager UI.
# Optional Telegram/Discord external delivery is configured via local secret files only.
receivers:
  - name: local-only
    webhook_configs:
      - url: 'http://127.0.0.1:5000/operational/alerts/webhook'
        send_resolved: true
