name: cryptotrading-observability

services:
  otel-collector:
    image: ${OTEL_COLLECTOR_IMAGE:-otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6}
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    user: "0:0"
    environment:
      DOCKER_LOG_ROOT: /var/lib/docker
      CRYPTO_API_CONTAINER_ID: ${CRYPTO_API_CONTAINER_ID:-disabled-api}
      CRYPTO_WORKER_CONTAINER_ID: ${CRYPTO_WORKER_CONTAINER_ID:-disabled-worker}
      CRYPTO_WEB_CONTAINER_ID: ${CRYPTO_WEB_CONTAINER_ID:-disabled-web}
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Rootful Docker default is /var/lib/docker. Set DOCKER_LOG_ROOT for a
      # rootless daemon; this is read-only and deliberately excludes the socket.
      - ${DOCKER_LOG_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - cryptotrading-otel-collector-data:/var/lib/otelcol
    ports:
      - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    security_opt:
      - no-new-privileges:true
    logging: &json-logs
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}
        # Only fixed Docker labels are retained; never include env values.
        labels: com.docker.compose.project,com.docker.compose.service

  loki:
    image: ${LOKI_IMAGE:-grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml", "-config.expand-env=true"]
    environment:
      LOKI_RETENTION_PERIOD: ${LOKI_RETENTION_PERIOD:-336h}
    volumes:
      - ./ops/observability/loki.yaml:/etc/loki/config.yaml:ro
      - cryptotrading-loki-data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    security_opt:
      - no-new-privileges:true
    logging: *json-logs

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e}
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - cryptotrading-prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    security_opt:
      - no-new-privileges:true
    logging: *json-logs

  alertmanager:
    # Official Prometheus image; version and multi-platform digest verified
    # against the prom/alertmanager:v0.34.1 Docker Hub page on 2026-10-08.
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a}
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./ops/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - cryptotrading-alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    security_opt:
      - no-new-privileges:true
    logging: *json-logs

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7}
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - cryptotrading-grafana-data:/var/lib/grafana
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true
    logging: *json-logs

  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd}
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./ops/observability/tempo.yaml:/etc/tempo.yaml:ro
      - cryptotrading-tempo-data:/tmp/tempo
    ports:
      - "127.0.0.1:${TEMPO_PORT:-3200}:3200"
    security_opt:
      - no-new-privileges:true
    logging: *json-logs

networks:
  default:
    name: ${OBSERVABILITY_NETWORK_NAME:-cryptotrading-observability}

volumes:
  cryptotrading-otel-collector-data:
  cryptotrading-prometheus-data:
  cryptotrading-grafana-data:
  cryptotrading-tempo-data:
  cryptotrading-loki-data:
  cryptotrading-alertmanager-data:
