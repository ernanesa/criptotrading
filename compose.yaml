name: cryptotrading

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptotrading}
      POSTGRES_USER: ${POSTGRES_USER:-cryptotrading}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the shell before starting PostgreSQL}
    ports:
      # Keep the database reachable only from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores the cluster in a versioned subdirectory below
      # this mount, which keeps major-version upgrades explicit and safe.
      - cryptotrading-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  cryptotrading-api:
    build:
      context: .
      dockerfile: src/CryptoTrading.Api/Dockerfile
    profiles: ["app", "api", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      POSTGRES_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-cryptotrading};Username=${POSTGRES_USER:-cryptotrading};Password=${POSTGRES_PASSWORD:-}"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cryptotrading-worker:
    build:
      context: .
      dockerfile: src/CryptoTrading.Worker/Dockerfile
    profiles: ["app", "worker", "all"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      POSTGRES_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-cryptotrading};Username=${POSTGRES_USER:-cryptotrading};Password=${POSTGRES_PASSWORD:-}"
      WORKER_AUTONOMY_ENABLED: "false"
      WORKER_NO_TRADE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  cryptotrading-web:
    build:
      context: src/CryptoTrading.Web
      dockerfile: Dockerfile
    profiles: ["app", "web", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    security_opt:
      - no-new-privileges:true

volumes:
  cryptotrading-postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-cryptotrading-postgres-data}
