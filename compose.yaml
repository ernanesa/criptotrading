name: cryptotrading

services:
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cryptotrading}
      POSTGRES_USER: ${POSTGRES_USER:-cryptotrading}
      POSTGRES_PASSWORD_FILE: /run/cryptotrading-postgres-secrets/postgres_password
    ports:
      # Keep the database reachable only from this machine.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 stores the cluster in a versioned subdirectory below
      # this mount, which keeps major-version upgrades explicit and safe.
      - cryptotrading-postgres-data:/var/lib/postgresql
      - ${POSTGRES_SECRETS_DIRECTORY:?Set POSTGRES_SECRETS_DIRECTORY to the mode-0700 PostgreSQL secret directory.}:/run/cryptotrading-postgres-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 100
    logging: &json-logs
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}
        # Do not select environment variables: credentials must never enter
        # the Docker JSON log attributes collected by observability.
        labels: com.docker.compose.project,com.docker.compose.service

  cryptotrading-api:
    build:
      context: .
      dockerfile: src/CryptoTrading.Api/Dockerfile
      args:
        CRYPTO_UID: ${LOCAL_UID:-1000}
        CRYPTO_GID: ${LOCAL_GID:-1000}
    profiles: ["app", "api", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-5000}:5000"
    environment:
      ASPNETCORE_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cryptotrading}
      POSTGRES_USER: ${POSTGRES_USER:-cryptotrading}
      POSTGRES_PASSWORD_FILE: /run/cryptotrading-postgres-secrets/postgres_password
      TRADING_ENVIRONMENT: ${TRADING_ENVIRONMENT:-TESTNET}
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://testnet.binance.vision/api}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://testnet.binance.vision/ws}
      BINANCE_WITHDRAWALS_ENABLED: "false"
      BINANCE_ALLOWED_SYMBOLS: ${BINANCE_ALLOWED_SYMBOLS:-BTCUSDT}
      API_INTERNAL_ACCESS_TOKEN_FILE: /run/secrets/api_internal_access_token
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ALLOWED_HOSTS: otel-collector
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${POSTGRES_SECRETS_DIRECTORY:?Set POSTGRES_SECRETS_DIRECTORY to the mode-0700 PostgreSQL secret directory.}:/run/cryptotrading-postgres-secrets:ro
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000 && printf 'GET /health/live HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 100
    secrets:
      - api_internal_access_token
    networks:
      default:
      observability:
    logging: *json-logs

  cryptotrading-worker:
    build:
      context: .
      dockerfile: src/CryptoTrading.Worker/Dockerfile
      args:
        CRYPTO_UID: ${LOCAL_UID:-1000}
        CRYPTO_GID: ${LOCAL_GID:-1000}
    profiles: ["app", "worker", "all"]
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: ${APP_ENVIRONMENT:-Development}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-cryptotrading}
      POSTGRES_USER: ${POSTGRES_USER:-cryptotrading}
      POSTGRES_PASSWORD_FILE: /run/cryptotrading-postgres-secrets/postgres_password
      TRADING_ENVIRONMENT: ${TRADING_ENVIRONMENT:-TESTNET}
      WORKER_EXECUTION_MODE: ${WORKER_EXECUTION_MODE:-PAPER}
      WORKER_NO_TRADE: ${WORKER_NO_TRADE:-true}
      WORKER_AUTONOMY_ENABLED: ${WORKER_AUTONOMY_ENABLED:-false}
      WORKER_TESTNET_EXECUTION_ACKNOWLEDGED: ${WORKER_TESTNET_EXECUTION_ACKNOWLEDGED:-false}
      WORKER_TESTNET_ORDER_EXECUTION_ENABLED: ${WORKER_TESTNET_ORDER_EXECUTION_ENABLED:-false}
      WORKER_PERSISTENCE_ENABLED: ${WORKER_PERSISTENCE_ENABLED:-false}
      WORKER_APPLY_MIGRATIONS: ${WORKER_APPLY_MIGRATIONS:-false}
      WORKER_RISK_POLICY_REQUIRED: ${WORKER_RISK_POLICY_REQUIRED:-false}
      WORKER_RECONCILIATION_ENABLED: ${WORKER_RECONCILIATION_ENABLED:-false}
      WORKER_ACCOUNT_STREAM_ENABLED: ${WORKER_ACCOUNT_STREAM_ENABLED:-false}
      WORKER_AUTONOMY_SYMBOL: ${WORKER_AUTONOMY_SYMBOL:-BTCUSDT}
      WORKER_AUTONOMY_INTERVAL: ${WORKER_AUTONOMY_INTERVAL:-1m}
      WORKER_RUNTIME_AUDIT_PATH: /var/lib/cryptotrading/audit/runtime-transitions.jsonl
      WORKER_ALERT_FILE_DIRECTORY: /var/lib/cryptotrading/audit/alerts
      WORKER_PROBE_FILE_PATH: /tmp/cryptotrading-worker-probe.json
      BINANCE_REST_BASE_URL: ${BINANCE_REST_BASE_URL:-https://testnet.binance.vision/api}
      BINANCE_WS_BASE_URL: ${BINANCE_WS_BASE_URL:-wss://testnet.binance.vision/ws}
      BINANCE_USER_STREAM_WS_API_BASE_URL: ${BINANCE_USER_STREAM_WS_API_BASE_URL:-wss://ws-api.testnet.binance.vision/ws-api/v3}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_ALLOWED_HOSTS: otel-collector
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cryptotrading-worker-audit:/var/lib/cryptotrading/audit
      - ${POSTGRES_SECRETS_DIRECTORY:?Set POSTGRES_SECRETS_DIRECTORY to the mode-0700 PostgreSQL secret directory.}:/run/cryptotrading-postgres-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/cryptotrading-worker-probe.json && grep -q '\"processAlive\":true' /tmp/cryptotrading-worker-probe.json"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1024m
    cpus: 1.0
    pids_limit: 100
    networks:
      default:
      observability:
    logging: *json-logs

  cryptotrading-web:
    build:
      context: src/CryptoTrading.Web
      dockerfile: Dockerfile
      args:
        CRYPTO_UID: ${LOCAL_UID:-1000}
        CRYPTO_GID: ${LOCAL_GID:-1000}
    profiles: ["app", "web", "all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8082}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 50
    secrets:
      - api_internal_access_token
    depends_on:
      cryptotrading-api:
        condition: service_started
    logging: *json-logs

secrets:
  # Initialize this local, untracked source with
  # scripts/init-proxy-secret.sh before starting the API/Web profile.
  api_internal_access_token:
    file: ${API_INTERNAL_ACCESS_TOKEN_SOURCE:?Run scripts/init-proxy-secret.sh and export API_INTERNAL_ACCESS_TOKEN_SOURCE.}

networks:
  observability:
    external: true
    name: ${OBSERVABILITY_NETWORK_NAME:-cryptotrading-observability}

volumes:
  cryptotrading-postgres-data:
    name: ${POSTGRES_VOLUME_NAME:-cryptotrading-postgres-data}
  cryptotrading-worker-audit:
    name: ${WORKER_AUDIT_VOLUME_NAME:-cryptotrading-worker-audit}
