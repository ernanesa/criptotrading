coverage_policy:
  every_backlog_epic_must_be_listed: true
  every_backlog_story_must_be_listed: true
  deferred_items_must_have_status: deferred_option
  acceptance_without_story_is_forbidden: true

validation_policy:
  planned_items_may_omit: [code, tests, evidence]
  ready_items_require: [requirements, acceptance, task, expected_validation]
  done_items_require: [code, tests, command, observed_result, review, evidence, residual_risk, rollback]
  forbidden_reference_forms: [implicit_numeric_range]
