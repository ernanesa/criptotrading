name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET restore, build, test and format
    runs-on: ubuntu-latest
    # The recovery drill starts isolated PostgreSQL containers. A cold GitHub
    # runner can legitimately spend several minutes pulling images and running
    # migrations, so keep the gate bounded without making it flaky.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Show SDK
        run: dotnet --info

      - name: Restore
        run: dotnet restore CryptoTrading.slnx --locked-mode

      - name: Build
        run: dotnet build CryptoTrading.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test CryptoTrading.slnx --no-build --configuration Release --verbosity normal

      - name: Verify formatting
        run: dotnet format CryptoTrading.slnx --no-restore --verify-no-changes

      - name: Start Worker with ephemeral PostgreSQL
        run: ./scripts/test-worker-persistence-startup.sh

      - name: Start API smoke test
        run: ./scripts/test-api-smoke.sh

      - name: Test recovery failure diagnostics redaction
        run: bash scripts/test-full-recovery-diagnostics.sh

      - name: Test PostgreSQL backup CLI contract
        run: bash scripts/test-backup-postgres.sh

      - name: Run composite local recovery drill
        run: ./scripts/test-full-recovery-drill.sh

  secret-scan:
    name: Repository secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install required secret-scan tooling
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ripgrep
          command -v rg

      - name: Scan repository files without printing matches
        run: ./scripts/scan-secrets.sh

      - name: Verify secret scanner fails closed without ripgrep
        run: bash scripts/test-secret-scan-tooling.sh

      - name: Verify Binance preflight failure diagnostics are redacted
        run: bash scripts/test-binance-readonly-preflight-diagnostics.sh

      - name: Validate traceability manifest
        run: ./scripts/validate-traceability.sh

      - name: Test traceability validator contract
        run: ./scripts/test-traceability-validator.sh

      - name: Test readiness validator contract
        run: ./scripts/test-readiness-validator.sh

      - name: Test public OOS credential guard
        run: ./scripts/test-public-oos-production-guard.sh

      - name: Test Testnet secret-storage preflight
        run: ./scripts/test-secret-storage-preflight.sh

      - name: Test secret initializer contract
        run: ./scripts/test-secret-initializer.sh

      - name: Test Binance read-only offline preflight
        run: ./scripts/test-binance-readonly-preflight.sh

  web:
    name: Web lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/CryptoTrading.Web
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CryptoTrading.Web/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  dependency-scan:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Restore locked .NET dependencies
        run: dotnet restore CryptoTrading.slnx --locked-mode

      - name: Report vulnerable .NET dependencies
        run: |
          mkdir -p artifacts/dependencies
          dotnet list CryptoTrading.slnx package --vulnerable --include-transitive --no-restore --format json > artifacts/dependencies/dotnet-vulnerabilities.json
          python3 scripts/check-dependency-vulnerabilities.py artifacts/dependencies/dotnet-vulnerabilities.json

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/CryptoTrading.Web/package-lock.json

      - name: Scan production Web dependencies
        working-directory: src/CryptoTrading.Web
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high

  containers:
    name: Container build, scan, smoke and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [dotnet, web]
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --tag cryptotrading-api:${{ github.sha }} --file src/CryptoTrading.Api/Dockerfile .

      - name: Build Worker image
        run: docker build --tag cryptotrading-worker:${{ github.sha }} --file src/CryptoTrading.Worker/Dockerfile .

      - name: Build Web image
        run: docker build --tag cryptotrading-web:${{ github.sha }} --file src/CryptoTrading.Web/Dockerfile src/CryptoTrading.Web

      - name: Prepare supply-chain artifacts
        run: mkdir -p artifacts/sbom artifacts/oci artifacts/build-metadata artifacts/security

      - name: Record all API image High/Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-api:${{ github.sha }}
          format: json
          output: artifacts/security/api-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Block all API image High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Record all Worker image High/Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-worker:${{ github.sha }}
          format: json
          output: artifacts/security/worker-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Block all Worker image High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-worker:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Record all Web image High/Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-web:${{ github.sha }}
          format: json
          output: artifacts/security/web-vulnerabilities.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Block all Web image High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-web:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Generate API SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-api:${{ github.sha }}
          format: spdx-json
          output: artifacts/sbom/api.spdx.json

      - name: Generate Worker SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-worker:${{ github.sha }}
          format: spdx-json
          output: artifacts/sbom/worker.spdx.json

      - name: Generate Web SPDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: cryptotrading-web:${{ github.sha }}
          format: spdx-json
          output: artifacts/sbom/web.spdx.json

      - name: Enable emulation
        uses: docker/setup-qemu-action@68827325e0b33c7199eb31dd4e31fbe9023e06e3 # v3.2.0

      - name: Configure Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Produce multi-architecture OCI evidence with attestations
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --metadata-file artifacts/build-metadata/api.json --output type=oci,dest=artifacts/oci/api.tar --file src/CryptoTrading.Api/Dockerfile .
          docker buildx build --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --metadata-file artifacts/build-metadata/worker.json --output type=oci,dest=artifacts/oci/worker.tar --file src/CryptoTrading.Worker/Dockerfile .
          docker buildx build --platform linux/amd64,linux/arm64 --sbom=true --provenance=mode=max --metadata-file artifacts/build-metadata/web.json --output type=oci,dest=artifacts/oci/web.tar --file src/CryptoTrading.Web/Dockerfile src/CryptoTrading.Web

      - name: Smoke Web to API proxy
        run: bash ./scripts/test-container-smoke.sh

      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-sboms-${{ github.sha }}
          retention-days: 30
          path: |
            artifacts/sbom/*.spdx.json
            artifacts/build-metadata/*.json
            artifacts/oci/*.tar
          if-no-files-found: error

      - name: Upload image vulnerability reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: image-vulnerability-reports-${{ github.sha }}
          retention-days: 30
          path: artifacts/security/*.json
          if-no-files-found: warn


  infrastructure-scan:
    name: Infrastructure image security gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: postgres
            image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
          - name: otel-collector
            image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
          - name: loki
            image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
          - name: prometheus
            image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
          - name: grafana
            image: grafana/grafana:11.5.2@sha256:8b37a2f028f164ce7b9889e1765b9d6ee23fec80f871d156fbf436d6198d32b7
          - name: tempo
            image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
          - name: alertmanager
            image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    steps:
      - name: Record all infrastructure High/Critical findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ matrix.image }}
          format: json
          output: trivy-infrastructure-${{ matrix.name }}.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Block all infrastructure High/Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: ${{ matrix.image }}
          format: table
          exit-code: '1'
          ignore-unfixed: false
          severity: CRITICAL,HIGH
          vuln-type: os,library
          scanners: vuln

      - name: Upload infrastructure vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: infrastructure-vulnerability-report-${{ matrix.name }}-${{ github.sha }}
          retention-days: 30
          path: trivy-infrastructure-${{ matrix.name }}.json
          if-no-files-found: warn
